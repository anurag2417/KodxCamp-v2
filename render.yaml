# =============================================================================
# Render Blueprint — https://render.com/docs/blueprint-spec
# =============================================================================
# One file describing every service Render should run for KodxCamp.
# Push to main → Render rebuilds and redeploys automatically.
#
# Build vs runtime:
#   We deliberately do NOT set NODE_ENV in the envVars block. If we did,
#   pnpm would skip devDependencies during build, and we need them (tsup,
#   typescript, tsx) to compile the service. Instead, NODE_ENV=production
#   is set inline on the startCommand for the runtime process only.
# =============================================================================

services:
  # ===========================================================================
  # Static site: portal + client apps
  # ===========================================================================
  - type: web
    name: kodxcamp-portal
    runtime: static
    buildCommand: |
      corepack enable
      corepack prepare pnpm@9.15.4 --activate
      pnpm install --frozen-lockfile --prod=false
      pnpm --filter @kodxcamp/portal build
    staticPublishPath: ./apps/portal/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate

  # ===========================================================================
  # Web service: core server
  # ===========================================================================
  - type: web
    name: kodxcamp-core
    runtime: node
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: |
      corepack enable
      corepack prepare pnpm@9.15.4 --activate
      pnpm install --frozen-lockfile --prod=false
      pnpm --filter @kodxcamp/core-server build
    startCommand: NODE_ENV=production node apps/core/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
