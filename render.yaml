# =============================================================================
# Render Blueprint — https://render.com/docs/blueprint-spec
# =============================================================================
# One file describing every service Render should run for KodxCamp.
# Push to main → Render rebuilds and redeploys automatically.
#
# Free-tier notes:
#   - Web services sleep after 15 minutes idle. A free uptime monitor
#     (e.g. UptimeRobot) pings /health every 10 minutes to keep them warm.
#   - Static sites are always on, no sleep.
#   - Static site and web service must share an origin to share cookies.
#     For now they're on separate *.onrender.com domains, so login cookies
#     will need the API-rewrite approach documented in Phase 1a.
# =============================================================================

services:
  # ===========================================================================
  # Static site: portal + client apps
  # ---------------------------------------------------------------------------
  # One static site serves everything front-facing. The build script assembles
  # each workspace's built output into a single dist/ folder, which Render
  # then serves with SPA fallback routing.
  # ===========================================================================
  - type: web
    name: kodxcamp-portal
    runtime: static
    buildCommand: |
      corepack enable
      corepack prepare pnpm@9.15.4 --activate
      pnpm install --frozen-lockfile
      pnpm --filter @kodxcamp/portal build
    staticPublishPath: ./apps/portal/dist
    routes:
      # SPA fallback: any unknown path returns index.html so client-side
      # routing works. API calls go to the core server via the rewrite below.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Long cache for hashed assets; short cache for HTML entry point.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate

  # ===========================================================================
  # Web service: core server
  # ---------------------------------------------------------------------------
  # Auth, users, coupons, grants, email. Free plan. Sleeps after idle; the
  # uptime monitor keeps it warm.
  # ===========================================================================
  - type: web
    name: kodxcamp-core
    runtime: node
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: |
      corepack enable
      corepack prepare pnpm@9.15.4 --activate
      pnpm install --frozen-lockfile
      pnpm --filter @kodxcamp/core-server build
    startCommand: node apps/core/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.11.0
      - key: LOG_LEVEL
        value: info
      # DATABASE_URL is set in the Render dashboard (Neon connection string),
      # not here — we don't want it in the repo. Marked sync:false so Render
      # prompts for it on first deploy.
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Public-facing origin of the portal static site. Set in the dashboard
      # once Render assigns a URL.
      - key: PUBLIC_SITE_URL
        sync: false

# =============================================================================
# Notes for future services (not deployed yet):
#   - Live product (Phase 3) will add a second web service for /apps/live.
#   - Practice server (Phase 2) will add a third.
#   - When we buy a real domain, remove `sync: false` for PUBLIC_SITE_URL and
#     set it here as a static value.
# =============================================================================
