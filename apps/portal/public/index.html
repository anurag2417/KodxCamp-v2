<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KodxCamp</title>
    <meta name="description" content="Learn programming by doing." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --card: #f8fafc;
        --border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --accent: #60a5fa;
          --card: #111a2e;
          --border: #1f2a44;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        max-width: 640px;
        width: 100%;
        text-align: center;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3.5rem);
        margin: 0 0 12px;
        letter-spacing: -0.02em;
      }
      p {
        color: var(--muted);
        font-size: 1.125rem;
        margin: 0 0 32px;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.8125rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      footer {
        margin-top: 48px;
        color: var(--muted);
        font-size: 0.875rem;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Pre-alpha</div>
      <h1>KodxCamp</h1>
      <p>Learn programming by doing.</p>
      <p style="font-size: 0.95rem;">
        We're building this in the open. The site is not yet available to
        learners.
      </p>
      <footer>
        <a href="https://github.com/anurag2417/KodxCamp-v2">GitHub</a>
      </footer>
    </main>
  </body>
</html>
